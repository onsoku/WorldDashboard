name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: the lock file is what keeps CI resolving the
      # same dependency tree as a developer machine. Before it was tracked
      # (#30), CI picked up a newer eslint-plugin-react-hooks and failed on
      # three lint errors that did not reproduce locally.
      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
